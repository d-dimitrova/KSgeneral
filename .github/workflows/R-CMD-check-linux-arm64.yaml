name: R CMD check - Linux ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  R-CMD-check-linux-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Show system information
        run: |
          echo "=== Architecture ==="
          uname -m
          echo "=== System ==="
          uname -a
          echo "=== R ==="
          Rscript -e 'sessionInfo()'

      - name: Build package
        run: |
          R CMD build .

      - name: R CMD check
        run: |
          PKG=$(ls -1t KSgeneral_*.tar.gz | head -n 1)
          echo "Checking $PKG"
          R CMD check --as-cran --no-manual "$PKG"
